# Cache zones configuration
proxy_cache_path /var/cache/nginx/frontend
    levels=1:2 
    keys_zone=frontend_cache:10m 
    max_size=1g 
    inactive=60m 
    use_temp_path=off;

proxy_cache_path /var/cache/nginx/api
    levels=1:2 
    keys_zone=api_cache:10m 
    max_size=500m 
    inactive=10m 
    use_temp_path=off;

# Upstream definitions
upstream frontend {
    server localhost:3000;
    keepalive 32;
}

upstream backend {
    server localhost:1337;
    keepalive 32;
}

upstream imgproxy {
    server localhost:8080;
    keepalive 32;
}

upstream search {
    server localhost:7700;
    keepalive 32;
}

# Map for cache bypass conditions
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Map for determining if request should bypass cache
map $request_method $no_cache {
    default 0;
    POST    1;
    PUT     1;
    DELETE  1;
    PATCH   1;
}

# ============================================================================
# Frontend - Production (www.familydom-production.snpdev.ru -> familydom-production.snpdev.ru redirect)
# ============================================================================
server {
    server_name www.familydom-production.snpdev.ru;
    server_tokens off;

    # Redirect www to non-www
    return 301 https://familydom-production.snpdev.ru$request_uri;
}

# ============================================================================
# Frontend - Production (familydom-production.snpdev.ru)
# ============================================================================
server {
    server_name familydom-production.snpdev.ru;
    server_tokens off;
    client_max_body_size 20M;

    location ~* ^/uploads {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Для статических файлов можно добавить кеширование
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    }

    # Main location - Next.js application
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Url-Scheme $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket support for Next.js HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_redirect off;
    }

    # Next.js static files - long-term caching
    location /_next/static {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;

        proxy_cache frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $no_cache;

        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Next.js image optimization
    location /_next/image {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 60m;
        proxy_cache_bypass $http_upgrade $no_cache;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_redirect off;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static assets caching - CSS, JS, images, fonts, etc.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aggressive caching for static assets
        proxy_cache frontend_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $no_cache;

        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================================================
# Backend API - Production (admin.skfd.ru)
# ============================================================================
server {
    server_name admin.familydom-production.snpdev.ru;
    server_tokens off;
    client_max_body_size 100M;

    # Main API location
    location / {
        proxy_pass http://backend;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # WebSocket support for Strapi admin
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeouts for file uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Disable buffering for real-time updates
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Media files caching
    location ~ ^/uploads/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # Cache media files
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_bypass $no_cache;

        # Extended timeouts for large files
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header Cache-Control "public, max-age=2592000";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Strapi admin panel
    location /admin {
        proxy_pass http://backend/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;

        # WebSocket support for admin panel
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Health check endpoint
    location /_health {
        proxy_pass http://backend/_health;
        access_log off;
    }
}

server {
    server_name search.familydom-production.snpdev.ru;
    server_tokens off;
    client_max_body_size 50M;

    # Main imgproxy location
    location / {
        proxy_pass http://search;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Caching for processed images
        proxy_cache api_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_bypass $no_cache;

        add_header X-Cache-Status $upstream_cache_status;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://search/health;
        access_log off;
    }
}


